[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bh-ns-source-generalization"
version = "0.1.0"
description = "Provenance-first, source-disjoint RXTE spectral classification infrastructure"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
  "matplotlib>=3.8,<4", "scikit-learn>=1.5,<2", 
  "PyYAML>=6,<7", "joblib>=1.3,<2",  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
astronomy = ["astropy>=6,<9"]
dev = ["pytest>=8,<10"]
neural = ["torch>=2.2,<3"]
columnar = ["pyarrow>=15", "h5py>=3.10"]

[project.scripts]
bhns = "bhns.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not full_workspace'"
markers = ["full_workspace: requires omitted raw/intermediate historical workspace artifacts"]
filterwarnings = ["error"]
