integrity_filters: Unchanged secure labels, canonical aliases, exact ObsID/position
  mapping, valid PHA/background/response, positive exposure, original screening and
  detector definitions
excluded_integrity_cases:
- XTE J1908/4U1907 attribution conflict
- IGR J17379 unresolved pointing
- candidate/probable/likely BH labels
- ambiguous cluster attribution
cohort_definitions:
  PRIMARY_MINOBS_4:
    branch: ARCHIVE
    minimum_observations: 4
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
  PRIMARY_MINOBS_3:
    branch: ARCHIVE
    minimum_observations: 3
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
  PRIMARY_MINOBS_2:
    branch: ARCHIVE
    minimum_observations: 2
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
  STRICT_PRIMARY_STYLE:
    branch: HEASOFT
    minimum_observations: 4
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
  MINOBS_3:
    branch: HEASOFT
    minimum_observations: 3
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
  MINOBS_2:
    branch: HEASOFT
    minimum_observations: 2
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
  QUALITY_RELAXED:
    branch: HEASOFT
    minimum_observations: 4
    net_rate_greater_than: 4.0
    background_rule: unchanged >5 rows; new 4--5 rows <=0.60 with declared quality
      guards
  EXPANDED_SECURE_RELAXED:
    branch: HEASOFT
    minimum_observations: 2
    net_rate_greater_than: 4.0
    background_rule: unchanged >5 rows; new 4--5 rows <=0.60 with declared quality
      guards
  PRIMARY_29:
    branch: ARCHIVE
    minimum_observations: 4
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
    alias_of: PRIMARY_MINOBS_4
  EXPANDED_SOURCE:
    branch: HEASOFT
    minimum_observations: 2
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
    alias_of: MINOBS_2
  HEASOFT_VALIDATION:
    branch: HEASOFT
    minimum_observations: 2
    net_rate_greater_than: 5.0
    background_rule: no universal fraction cap; valid modeled background required
main_ladder:
- STRICT_PRIMARY_STYLE
- MINOBS_3
- MINOBS_2
- EXPANDED_SECURE_RELAXED
auxiliary_quality_only: 'QUALITY_RELAXED: same strict >=4 sources rule; only declared
  low-rate addition changes'
principal_cohort: EXPANDED_SECURE_RELAXED
new_low_rate_guards:
  maximum_background_fraction: 0.6
  maximum_fractional_band_error: 0.05
  maximum_median_fractional_bin_error: 0.35
  maximum_negative_bin_fraction: 0.1
  minimum_new_row_exposure: 256.0
minimum_sources_per_class: 5
minimum1: NOT_RUN; no unique eligible-source gain
background_policy: No universal baseline fraction limit to relax. Additional guards
  apply only to newly admitted low-rate rows; never weaken background-product validity.
exposure_policy: Original positive exposure and GTIs unchanged; new low-rate rows
  additionally >=256 seconds
detector_policy: Primary archive selected detector support unchanged; HEASoft PCU2
  top xenon layer and deadtime correction unchanged
features: 43 original detector-space rates; no errors added as model inputs; no imputation,
  PCA or new architecture
models:
  logistic:
    C:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    solver: liblinear
    max_iter: 3000
  forest:
    n_estimators: 100
    max_depth:
    - 4
    - null
    min_samples_leaf: 3
    n_jobs: 2
outer_splits:
- 5-fold stratified physical-source grouped CV
- LOSO
inner_split: 20% stratified physical-source validation inside outer training; first
  candidate wins ties; source balanced accuracy tuning
preprocessing: Training-only StandardScaler at inner and outer refit; unchanged fit_fold
  implementation
weighting: Equal total training weight per source
aggregation: Mean log odds; clip [1e-7,1-1e-7]
positive_class: NS
threshold: 0.5
random_seed: 42
metrics:
- AUROC
- balanced_accuracy
- MCC
- F1
- precision
- recall
- PR_AUC
- Brier
- accuracy
uncertainty:
  method: class-stratified percentile physical-source bootstrap
  draws: 2000
  seed: 42
  level: 0.95
  qualification: Conditional on selected sources/fitted predictions; no refitting
    inside bootstrap
performance_policy: Fit each unique branch/row-ordered spectral cohort once per model/split;
  exact duplicate cohort aliases reuse those outputs. No observation-wise fits. No
  postperformance rule/row/source changes.
state_policy: Reuse only existing DIRECT/STRONG evidence; original STATE_EXTENSION_CLOSED_INFEASIBLE
  and five-per-class gate unchanged; no state classifier
verdict_policy: If no independent source is added beyond frozen EXPANDED_SOURCE, RELAXATION_NO_BENEFIT
  for the source-diversity objective regardless of AUROC. Counterfactual >=4 recovery
  reported separately.
publication_policy: No manuscript edits; scope recommendation follows source-diversity
  value and quality, not metric direction
