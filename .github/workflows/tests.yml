name: lightweight-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -c "import bhns; import astropy; import sklearn"
      - run: python scripts/verify_release.py
      - run: python -m pytest -q
      - name: Phase-II contract tests when present
        run: |
          if [ -d cross_mission/tests ]; then
            python -m pytest cross_mission/tests -q
          fi
      - run: python scripts/reproduce_tables.py
      - run: python scripts/render_journal_figures.py
